```yaml
name: Check Three Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          SECRET_1: ${{ secrets.API_SERVER }}
          SECRET_2: ${{ secrets.RENDEZVOUS_SERVER }}
          SECRET_3: ${{ secrets.RS_PUB_KEY }}
        shell: bash
        run: |
          check_secret() {
            local name="$1"
            local value="$2"

            if [[ -n "$value" ]]; then
              echo "$name: configured"
              echo "$name length: ${#value}"
            else
              echo "$name: empty or unavailable"
            fi
          }

          check_secret "SECRET_1" "$SECRET_1"
          check_secret "SECRET_2" "$SECRET_2"
          check_secret "SECRET_3" "$SECRET_3"
```
