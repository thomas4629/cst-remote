name: Export RustDesk Configuration

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Write configuration file
        env:
          API_SERVER: ${{ secrets.API_SERVER }}
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          for name in API_SERVER RENDEZVOUS_SERVER RS_PUB_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is empty or unavailable"
              exit 1
            fi
          done

          {
            printf 'API_SERVER=%s\n' "$API_SERVER"
            printf 'RENDEZVOUS_SERVER=%s\n' "$RENDEZVOUS_SERVER"
            printf 'RS_PUB_KEY=%s\n' "$RS_PUB_KEY"
          } > rustdesk-config.txt

      - name: Upload configuration file
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-config
          path: rustdesk-config.txt
          retention-days: 1
          if-no-files-found: error
