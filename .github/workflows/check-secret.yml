```yaml
name: Check Three Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          API_SERVER: ${{ secrets.SECRET_1 }}
          RENDEZVOUS_SERVER: ${{ secrets.SECRET_2 }}
          RS_PUB_KEY: ${{ secrets.SECRET_3 }}
        run: |
          for name in SECRET_1 SECRET_2 SECRET_3; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name: configured, length=${#value}"
            else
              echo "$name: empty or unavailable"
            fi
          done
```
