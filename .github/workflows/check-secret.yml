name: Check Three Secrets

on:
  workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          API_SERVER: ${{ secrets.API_SERVER }}
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          if [ -n "$API_SERVER" ]; then
            echo "API_SERVER is configured"
          else
            echo "API_SERVER is empty or unavailable"
          fi

          if [ -n "$RENDEZVOUS_SERVER" ]; then
            echo "RENDEZVOUS_SERVER is configured"
          else
            echo "RENDEZVOUS_SERVER is empty or unavailable"
          fi

          if [ -n "$RS_PUB_KEY" ]; then
            echo "RS_PUB_KEY is configured"
          else
            echo "RS_PUB_KEY is empty or unavailable"
          fi
